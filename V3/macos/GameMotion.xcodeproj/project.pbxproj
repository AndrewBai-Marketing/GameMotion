			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -e\nBUNDLE=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/backend/GameMotionBackend\"\nBACKEND_EXE=\"$BUNDLE/GameMotionBackend\"\n\nif [ ! -f \"$BACKEND_EXE\" ]; then\n  echo \"Backend exe not present — skipping re-sign step\"\n  exit 0\nfi\n\nENTITLEMENTS=\"${SRCROOT}/GameMotion/backend.entitlements\"\n\n# Pick signing identity: use real identity for MAS, fall back to ad-hoc for local dev\nif [ -n \"${EXPANDED_CODE_SIGN_IDENTITY}\" ]; then\n  IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY}\"\n  echo \"Signing with identity: $IDENTITY\"\nelse\n  IDENTITY=\"-\"\n  echo \"No signing identity — using ad-hoc for local dev\"\nfi\n\n# Re-sign all bundled .so and .dylib files first\nfind \"$BUNDLE/_internal\" \\( -name \"*.so\" -o -name \"*.dylib\" \\) | while read f; do\n  codesign --force --sign \"$IDENTITY\" \"$f\" 2>/dev/null\ndone\n\n# Re-sign the main executable with entitlements\nif [ -f \"$ENTITLEMENTS\" ]; then\n  codesign --force --sign \"$IDENTITY\" --entitlements \"$ENTITLEMENTS\" \"$BACKEND_EXE\"\nelse\n  codesign --force --sign \"$IDENTITY\" \"$BACKEND_EXE\"\nfi\n\necho \"✓ Backend binary re-signed\"\n";
		};
