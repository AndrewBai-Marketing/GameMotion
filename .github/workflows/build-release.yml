name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.0)'
        required: true
        default: 'v1.2.0'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Windows  (.exe installer)
  # ──────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build Python backend with PyInstaller ──
      - name: Install Python dependencies
        working-directory: V3/backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend binary
        working-directory: V3/backend
        run: pyinstaller gamemotion_backend.spec --noconfirm

      - name: Verify backend build
        shell: bash
        run: ls -la V3/backend/dist/GameMotionBackend/

      # ── Build Next.js frontend (static export) ──
      - name: Install frontend dependencies
        working-directory: V3/frontend
        run: npm ci

      - name: Build frontend
        working-directory: V3/frontend
        run: npm run build

      - name: Verify frontend build
        shell: bash
        run: ls -la V3/frontend/out/

      # ── Package with Electron ──
      - name: Install Electron dependencies
        working-directory: V3/electron
        run: npm ci

      - name: Pre-build check
        shell: bash
        run: |
          echo "=== Backend dist ==="
          ls -la V3/backend/dist/GameMotionBackend/ | head -20
          echo "=== Frontend out ==="
          ls -la V3/frontend/out/ | head -20
          echo "=== Electron build dir ==="
          ls -la V3/electron/build/

      - name: Build Windows installer
        working-directory: V3/electron
        run: npx electron-builder -w --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: V3/electron/dist/*.exe

  # ──────────────────────────────────────────────────────────────
  # macOS  (.dmg + .zip, Apple Silicon)
  # ──────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build Python backend with PyInstaller ──
      - name: Install Python dependencies
        working-directory: V3/backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend binary
        working-directory: V3/backend
        run: pyinstaller gamemotion_backend.spec --noconfirm

      - name: Verify backend build
        run: |
          ls -la V3/backend/dist/GameMotionBackend/
          file V3/backend/dist/GameMotionBackend/GameMotionBackend

      # ── Build Next.js frontend (static export) ──
      - name: Install frontend dependencies
        working-directory: V3/frontend
        run: npm ci

      - name: Build frontend
        working-directory: V3/frontend
        run: npm run build

      - name: Verify frontend build
        run: ls -la V3/frontend/out/

      # ── Package with Electron ──
      - name: Install Electron dependencies
        working-directory: V3/electron
        run: npm ci

      - name: Pre-build check
        run: |
          echo "=== Backend dist ==="
          ls -la V3/backend/dist/GameMotionBackend/ | head -20
          echo "=== Frontend out ==="
          ls -la V3/frontend/out/ | head -20
          echo "=== Electron build dir ==="
          ls -la V3/electron/build/

      - name: Build macOS installer
        working-directory: V3/electron
        run: npx electron-builder -m
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            V3/electron/dist/*.dmg
            V3/electron/dist/*.zip

  # ──────────────────────────────────────────────────────────────
  # Linux  (.AppImage + .deb)
  # ──────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build Python backend with PyInstaller ──
      - name: Install Python dependencies
        working-directory: V3/backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend binary
        working-directory: V3/backend
        run: pyinstaller gamemotion_backend.spec --noconfirm

      - name: Verify backend build
        run: |
          ls -la V3/backend/dist/GameMotionBackend/
          file V3/backend/dist/GameMotionBackend/GameMotionBackend

      # ── Build Next.js frontend (static export) ──
      - name: Install frontend dependencies
        working-directory: V3/frontend
        run: npm ci

      - name: Build frontend
        working-directory: V3/frontend
        run: npm run build

      - name: Verify frontend build
        run: ls -la V3/frontend/out/

      # ── Package with Electron ──
      - name: Install Electron dependencies
        working-directory: V3/electron
        run: npm ci

      - name: Pre-build check
        run: |
          echo "=== Backend dist ==="
          ls -la V3/backend/dist/GameMotionBackend/ | head -20
          echo "=== Frontend out ==="
          ls -la V3/frontend/out/ | head -20
          echo "=== Electron build dir ==="
          ls -la V3/electron/build/

      - name: Build Linux installer
        working-directory: V3/electron
        run: npx electron-builder -l --x64 2>&1 | tee ../build-linux.log || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: V3/build-linux.log

      - name: Check build result
        run: |
          if [ ! -f V3/electron/dist/*.AppImage ] && [ ! -f V3/electron/dist/*.deb ]; then
            echo "Build failed - see build log artifact"
            cat V3/build-linux.log | tail -50
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            V3/electron/dist/*.AppImage
            V3/electron/dist/*.deb

  # ──────────────────────────────────────────────────────────────
  # Create GitHub Release with all installers
  # ──────────────────────────────────────────────────────────────
  create-release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: GameMotion ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## GameMotion Release

            ### Downloads
            - **Windows**: Download the `.exe` installer
            - **macOS (Apple Silicon)**: Download the `.dmg` (or `.zip` for manual install)
            - **Linux**: Download the `.AppImage` or `.deb`

            ### First-time Setup
            1. Install and launch the application
            2. Grant camera permission when prompted
            3. On macOS: grant Accessibility permission in System Preferences > Privacy & Security
            4. The app creates its config directory automatically on first run

            ### Notes
            - macOS: If you see a Gatekeeper warning, right-click the app and choose "Open"
            - Windows: If SmartScreen warns, click "More info" then "Run anyway"

            See [README](https://github.com/AndrewBai-Marketing/GameMotion/blob/main/README.md) for detailed instructions.
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.AppImage
            dist/**/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
